version: '3.9'
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: jobtracker
      JWT_SECRET: supersecretjwtkey
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  mongodb_data:
